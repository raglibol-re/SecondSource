<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Proof</title>
  <meta name="description" content="Every on-chain transaction SecondSource made, and the Airnode signers it trusts." />
  <link rel="icon" href="/assets/seal.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/style.css" />
  <script src="/assets/theme.js"></script>
</head>
<body>
  <header class="masthead">
    <div class="wrap">
      <a class="brand" href="/"><img class="seal" src="/assets/seal.svg" alt="" />SecondSource</a>
      <nav class="nav" aria-label="Main">
        <a href="/check">Ask</a>
        <a href="/vault">Contract</a>
        <a href="/receipts" aria-current="page">Proof</a>
        <button class="theme-toggle" type="button">Light mode</button>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <div class="page-head">
      <h1>Proof</h1>
      <p class="lede">Everything SecondSource did, on chain. Testnets only.</p>
    </div>

    <section style="padding-bottom: 48px">
      <div class="cols" id="proof"><p class="muted">Loading…</p></div>
    </section>

    <section style="padding-bottom: 48px">
      <h2 style="margin-bottom: 16px">Latest transactions</h2>
      <div class="table-scroll" id="txs"><p class="muted">Loading…</p></div>
    </section>

    <section style="padding-bottom: 72px">
      <details class="more">
        <summary>The wallet and the Airnode signers SecondSource trusts</summary>
        <p id="payer" class="muted" style="margin-top: 12px">Loading…</p>
        <div class="table-scroll" id="signers"><p class="muted">Loading…</p></div>
      </details>
    </section>
  </main>
  <footer class="site"><div class="wrap">Testnets only: Base Sepolia and Cardano Preprod.</div></footer>

  <script type="module">
    import { esc } from '/assets/report.js';
    const names = { twitter: 'TwitterAPI.io', benzinga: 'Benzinga', tickerlayer: 'TickerLayer', openrouter: 'OpenRouter', nodary: 'Nodary' };
    try {
      const p = await (await fetch('/data/proof.json', { cache: 'no-store' })).json();
      const base = (tx) => `https://sepolia.basescan.org/tx/${tx}`;
      const ada = (tx) => `https://preprod.cardanoscan.io/transaction/${tx}`;
      const link = (href, text) => `<a href="${esc(href)}" target="_blank" rel="noopener">${esc(text)}</a>`;
      const blocks = [];
      if (p.vault)
        blocks.push(`<div><h3>Guarded Vault, Base Sepolia</h3><p>Trades only with a Nodary price signed under 60 seconds ago, a primary-source post signed by the TwitterAPI.io Airnode, and a CONFIRMED verdict that cites it. <a href="/vault">Test it yourself</a>.</p>
          <p class="small">${link(`https://sepolia.basescan.org/address/${p.vault.address}`, 'Contract')}, ${link(base(p.vault.deployTx), 'deployment')}. Allowed and refused trades are in the list below.</p></div>`);
      if (p.masumi)
        blocks.push(`<div><h3>Masumi registry, Cardano Preprod</h3><p>SecondSource is a registered agent: ${esc(p.masumi.state === 'RegistrationConfirmed' ? 'confirmed' : p.masumi.state)}.</p>
          <p class="small">${link(ada(p.masumi.registrationTx), 'Registration transaction')}</p></div>`);
      if (p.sokosumi?.paidTask) {
        const t = p.sokosumi.paidTask;
        blocks.push(`<div><h3>A paid Sokosumi task</h3><p>${esc(t.price)}. Verdict ${esc(t.verdict)}, task ${esc(t.status.toLowerCase())}.</p>
          <p class="small">${link(ada(t.fundsLockedTx), 'Escrow locked')}, ${link(ada(t.resultSubmittedTx), 'result hash on chain')}${t.payout?.withdrawnTx ? `, ${link(ada(t.payout.withdrawnTx), 'payout to SecondSource')}` : ''}</p></div>`);
      }
      document.getElementById('proof').innerHTML = blocks.join('') || '<p>Nothing on chain yet.</p>';
    } catch {
      document.getElementById('proof').innerHTML = '<p>Could not load the on-chain summary.</p>';
    }
    try {
      const s = await (await fetch('/api/status')).json();
      document.getElementById('payer').innerHTML = s.payer
        ? `<a class="mono" href="https://sepolia.basescan.org/address/${esc(s.payer.address)}" target="_blank" rel="noopener">${esc(s.payer.address)}</a> on Base Sepolia holds <b>${esc(s.payer.ausd ?? '?')} aUSD</b>.`
        : await (async () => { try { const p = await (await fetch('/data/proof.json')).json(); return p.payer ? `<a class="mono" href="https://sepolia.basescan.org/address/${esc(p.payer)}" target="_blank" rel="noopener">${esc(p.payer)}</a> on Base Sepolia. Every x402 payment below comes from this wallet. Live checks on this site are switched off; recorded checks replay for free.` : 'No wallet is attached to this deployment.'; } catch { return 'No wallet is attached to this deployment.'; } })();
      document.getElementById('signers').innerHTML = `<table class="list"><thead><tr><th>API</th><th>Signer address</th><th>Price per call</th></tr></thead><tbody>${Object.entries(s.airnodes)
        .map(([k, v]) => {
          const prices = Object.values(s.prices[k] ?? {});
          const p = prices.length ? `${Math.min(...prices.map(Number)).toFixed(2)} aUSD` : 'free';
          return `<tr><td><a href="${esc(v.url)}" target="_blank" rel="noopener">${esc(names[k] ?? k)}</a></td><td class="mono">${esc(v.address)}</td><td>${p}</td></tr>`;
        })
        .join('')}</tbody></table>`;
    } catch {
      document.getElementById('payer').textContent = 'Could not reach the status endpoint.';
    }
    try {
      const txs = await (await fetch('/data/transactions.json', { cache: 'no-store' })).json();
      if (!txs.length) throw new Error();
      const rows = txs
        .slice()
        .reverse()
        .map((t) => `<tr><td>${esc(t.when.replace('T', ' ').slice(5, 16))}</td><td>${esc(t.network.replace('Cardano Preprod', 'Cardano').replace('Base Sepolia', 'Base'))}</td><td>${esc(t.what)}</td><td><a href="${esc(t.link)}" target="_blank" rel="noopener">View</a></td></tr>`);
      const table = (n) => `<table class="list"><thead><tr><th>When (UTC)</th><th>Chain</th><th>What</th><th></th></tr></thead><tbody>${rows.slice(0, n).join('')}</tbody></table>`;
      const box = document.getElementById('txs');
      box.innerHTML = table(12) + (rows.length > 12 ? `<p style="margin-top: 12px"><button type="button" class="linklike" id="alltx">Show all ${rows.length} transactions</button></p>` : '');
      document.getElementById('alltx')?.addEventListener('click', () => (box.innerHTML = table(rows.length)));
    } catch {
      document.getElementById('txs').innerHTML = '<p>No transactions recorded yet.</p>';
    }
  </script>
</body>
</html>
